server {
    listen 80;
    listen [::]:80;
    server_name iooeh.com www.iooeh.com api.iooeh.com app.iooeh.com traccar.iooeh.com admin.iooeh.com;
    root /opt/trackeo/landing;
    location /.well-known/acme-challenge { allow all; }
    location / { return 301 https://$host$request_uri; }
}

# Landing Page
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name iooeh.com;

    ssl_certificate /etc/letsencrypt/live/iooeh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iooeh.com/privkey.pem;

    root /opt/trackeo/landing;
    index index.html;
    error_page 404 /404.html;
    location = /404.html { internal; }
    location / { try_files $uri $uri/ =404; }
}

# Canonical landing URL
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.iooeh.com;

    ssl_certificate /etc/letsencrypt/live/iooeh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iooeh.com/privkey.pem;

    return 301 https://iooeh.com$request_uri;
}

# Web App
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.iooeh.com;

    ssl_certificate /etc/letsencrypt/live/iooeh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iooeh.com/privkey.pem;

    root /opt/trackeo/web;
    index index.html;

    location = /.well-known/apple-app-site-association {
        types { }
        default_type application/json;
        try_files $uri =404;
    }

    location = /.well-known/assetlinks.json {
        default_type application/json;
        try_files $uri =404;
    }

    # Flutter utilise des noms de bundles stables. Ces fichiers doivent être
    # revalidés à chaque ouverture pour éviter qu'une ancienne PWA reste figée.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location ~ ^/(flutter_service_worker\.js|flutter_bootstrap\.js|main\.dart\.js|version\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

# Trackeo aliases hosted on zenkai.mg
server {
    listen 80;
    listen [::]:80;
    server_name trackeo.zenkai.mg app.trackeo.zenkai.mg api.trackeo.zenkai.mg traccar.trackeo.zenkai.mg;
    location /.well-known/acme-challenge { allow all; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trackeo.zenkai.mg app.trackeo.zenkai.mg;

    ssl_certificate /etc/letsencrypt/live/trackeo.zenkai.mg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trackeo.zenkai.mg/privkey.pem;

    root /opt/trackeo/web;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location ~ ^/(flutter_service_worker\.js|flutter_bootstrap\.js|main\.dart\.js|version\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.trackeo.zenkai.mg;

    ssl_certificate /etc/letsencrypt/live/trackeo.zenkai.mg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trackeo.zenkai.mg/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name traccar.trackeo.zenkai.mg;

    ssl_certificate /etc/letsencrypt/live/trackeo.zenkai.mg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trackeo.zenkai.mg/privkey.pem;

    location / {
