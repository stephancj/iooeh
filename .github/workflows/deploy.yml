name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "What to deploy"
        required: true
        default: "all"
        type: choice
        options:
          - api
          - web
          - ios
          - admin
          - landing
          - infra
          - all

concurrency:
  group: trackeo-production-deployment
  cancel-in-progress: false

jobs:
  # ===========================================
  # DETECT CHANGES & COMPUTE DEPLOY TARGETS
  # ===========================================
  check-changes:
    name: Check changes
    runs-on: ubuntu-latest
    outputs:
      deploy_api: ${{ steps.targets.outputs.deploy_api }}
      deploy_web: ${{ steps.targets.outputs.deploy_web }}
      deploy_ios: ${{ steps.targets.outputs.deploy_ios }}
      deploy_admin: ${{ steps.targets.outputs.deploy_admin }}
      deploy_landing: ${{ steps.targets.outputs.deploy_landing }}
      deploy_infra: ${{ steps.targets.outputs.deploy_infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect file changes
        uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            api:
              - 'apps/api/**'
            mobile:
              - 'apps/mobile/**'
            admin:
              - 'apps/admin/**'
            landing:
              - 'apps/landing/**'
            infra:
              - 'infra/**'
              - 'docker-compose.yml'

      - name: Compute deploy targets
        id: targets
        run: |
          EVENT="${{ github.event_name }}"
          TARGET="${{ github.event.inputs.deploy_target }}"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "deploy_api=$( [ "$TARGET" = "api" ] || [ "$TARGET" = "all" ] && echo true || echo false )" >> $GITHUB_OUTPUT
            echo "deploy_web=$( [ "$TARGET" = "web" ] || [ "$TARGET" = "all" ] && echo true || echo false )" >> $GITHUB_OUTPUT
            echo "deploy_ios=$( [ "$TARGET" = "ios" ] && echo true || echo false )" >> $GITHUB_OUTPUT
            echo "deploy_admin=$( [ "$TARGET" = "admin" ] || [ "$TARGET" = "all" ] && echo true || echo false )" >> $GITHUB_OUTPUT
            echo "deploy_landing=$( [ "$TARGET" = "landing" ] || [ "$TARGET" = "all" ] && echo true || echo false )" >> $GITHUB_OUTPUT
            echo "deploy_infra=$( [ "$TARGET" = "infra" ] || [ "$TARGET" = "all" ] && echo true || echo false )" >> $GITHUB_OUTPUT
          else
            echo "deploy_api=${{ steps.filter.outputs.api }}" >> $GITHUB_OUTPUT
            echo "deploy_web=${{ steps.filter.outputs.mobile }}" >> $GITHUB_OUTPUT
            echo "deploy_ios=false" >> $GITHUB_OUTPUT
            echo "deploy_admin=${{ steps.filter.outputs.admin }}" >> $GITHUB_OUTPUT
            echo "deploy_landing=${{ steps.filter.outputs.landing }}" >> $GITHUB_OUTPUT
            echo "deploy_infra=${{ steps.filter.outputs.infra }}" >> $GITHUB_OUTPUT
          fi

          # iOS désactivé du déploiement auto (signing "invalid curve name" à
          # corriger) — relançable manuellement via workflow_dispatch target=ios.

      - name: Log deploy targets
        run: |
          echo "## Deploy targets" >> $GITHUB_STEP_SUMMARY
          echo "- API: ${{ steps.targets.outputs.deploy_api }}" >> $GITHUB_STEP_SUMMARY
          echo "- Web: ${{ steps.targets.outputs.deploy_web }}" >> $GITHUB_STEP_SUMMARY
          echo "- iOS: ${{ steps.targets.outputs.deploy_ios }}" >> $GITHUB_STEP_SUMMARY
          echo "- Admin: ${{ steps.targets.outputs.deploy_admin }}" >> $GITHUB_STEP_SUMMARY
          echo "- Landing: ${{ steps.targets.outputs.deploy_landing }}" >> $GITHUB_STEP_SUMMARY
          echo "- Infra: ${{ steps.targets.outputs.deploy_infra }}" >> $GITHUB_STEP_SUMMARY

  # ===========================================
  # DEPLOY API (docker-compose on VPS)
  # ===========================================
  deploy-api:
    name: Deploy API
    needs: check-changes
    if: needs.check-changes.outputs.deploy_api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy API via docker-compose
        env:
          PAPI_API_KEY: ${{ secrets.PAPI_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
        run: |
          test -n "$PAPI_API_KEY"
          test -n "$TURNSTILE_SECRET_KEY"
          test -n "$BREVO_API_KEY"
          test -n "$BREVO_SENDER_EMAIL"
          trackeo_papi_key_b64=$(printf '%s' "$PAPI_API_KEY" | base64 | tr -d '\n')
          trackeo_turnstile_secret_b64=$(printf '%s' "$TURNSTILE_SECRET_KEY" | base64 | tr -d '\n')
          trackeo_brevo_key_b64=$(printf '%s' "$BREVO_API_KEY" | base64 | tr -d '\n')
          trackeo_brevo_sender_b64=$(printf '%s' "$BREVO_SENDER_EMAIL" | base64 | tr -d '\n')
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} "
            cd /opt/trackeo &&
            git fetch origin main &&
            git reset --hard origin/main &&
            touch apps/api/.env &&
            sed -i '/^PAPI_API_KEY=/d; /^PAPI_TEST_MODE=/d' apps/api/.env &&
            printf 'PAPI_API_KEY=' >> apps/api/.env &&
            printf '%s' '$trackeo_papi_key_b64' | base64 -d | perl -pe 's/\\044/\\044\\044/g' >> apps/api/.env &&
            printf '\\nPAPI_TEST_MODE=true\\n' >> apps/api/.env &&
            sed -i '/^TURNSTILE_SECRET_KEY=/d; /^TURNSTILE_ALLOWED_HOSTNAMES=/d' apps/api/.env &&
            printf 'TURNSTILE_SECRET_KEY=' >> apps/api/.env &&
            printf '%s' '$trackeo_turnstile_secret_b64' | base64 -d | perl -pe 's/\\044/\\044\\044/g' >> apps/api/.env &&
            printf '\\nTURNSTILE_ALLOWED_HOSTNAMES=iooeh.com,www.iooeh.com\\n' >> apps/api/.env &&
            sed -i '/^BREVO_API_KEY=/d; /^BREVO_SENDER_EMAIL=/d; /^BREVO_SENDER_NAME=/d; /^BREVO_REPLY_TO_EMAIL=/d; /^PUBLIC_LANDING_URL=/d' apps/api/.env &&
            printf 'BREVO_API_KEY=' >> apps/api/.env &&
            printf '%s' '$trackeo_brevo_key_b64' | base64 -d | perl -pe 's/\\044/\\044\\044/g' >> apps/api/.env &&
            printf '\\nBREVO_SENDER_EMAIL=' >> apps/api/.env &&
            printf '%s' '$trackeo_brevo_sender_b64' | base64 -d | perl -pe 's/\\044/\\044\\044/g' >> apps/api/.env &&
            printf '\\nBREVO_SENDER_NAME=iooeh\\nBREVO_REPLY_TO_EMAIL=contact@iooeh.com\\nPUBLIC_LANDING_URL=https://iooeh.com\\n' >> apps/api/.env &&
            grep -q '^DB_PASS=.' apps/api/.env &&
            touch .env &&
            sed -i '/^DB_PASS=/d' .env &&
            grep '^DB_PASS=' apps/api/.env | perl -pe 's/\\044/\\044\\044/g' >> .env &&
            docker compose up -d postgres &&
            cat \$(ls apps/api/migrations/*.sql | sort) | docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U trackeo -d traccar_db &&
            docker ps -a --filter 'name=trackeo-api' -q | xargs -r docker rm -f &&
            docker compose up -d --build --no-deps api &&
            docker inspect trackeo-api --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -q '^PAPI_API_KEY=' &&
            docker inspect trackeo-api --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -q '^PAPI_TEST_MODE=true$' &&
            docker inspect trackeo-api --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -q '^TURNSTILE_SECRET_KEY=' &&
            docker inspect trackeo-api --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -q '^TURNSTILE_ALLOWED_HOSTNAMES=iooeh.com,www.iooeh.com$' &&
            docker inspect trackeo-api --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -q '^BREVO_API_KEY=' &&
            docker inspect trackeo-api --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -q '^BREVO_SENDER_EMAIL='
          "

      - name: Health check
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} '
            for i in 1 2 3 4 5 6; do
              sleep 10
              if curl -sf https://api.iooeh.com/health 2>/dev/null || curl -sf https://api.iooeh.com/ 2>/dev/null; then
                echo "API is healthy"
                exit 0
              fi
              echo "Attempt $i failed, retrying..."
            done
            echo "Health check failed after 6 attempts"
            exit 1
          '

      - name: Prune stale Docker data
        if: always()
        continue-on-error: true
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} '
            docker builder prune -af --filter "until=168h"
            docker image prune -f
          '

  # ===========================================
  # BUILD WEB (Flutter web on GH runner)
  # ===========================================
  build-web:
    name: Build Web
    needs: check-changes
    if: needs.check-changes.outputs.deploy_web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          cache: true

      - run: cd apps/mobile && flutter pub get
      - run: cd apps/mobile && flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/mobile/build/web
          include-hidden-files: true
          retention-days: 7

  # ===========================================
  # DEPLOY WEB (static files to VPS)
  # ===========================================
  deploy-web:
    name: Deploy Web
    needs: [check-changes, build-web]
    if: needs.check-changes.outputs.deploy_web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web

      - uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy static files
        run: |
          scp -o StrictHostKeyChecking=no -r web/* ${{ secrets.VPS_HOST }}:/opt/trackeo/web/
          if [ -d web/.well-known ]; then
            ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} "mkdir -p /opt/trackeo/web/.well-known"
            scp -o StrictHostKeyChecking=no -r web/.well-known/* ${{ secrets.VPS_HOST }}:/opt/trackeo/web/.well-known/
          fi
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} "chmod -R 755 /opt/trackeo/web && chown -R www-data:www-data /opt/trackeo/web"

  # ===========================================
  # DEPLOY ADMIN (docker-compose on VPS)
  # ===========================================
  deploy-admin:
    name: Deploy Admin
    needs: [check-changes, deploy-api]
    if: >-
      always() &&
      needs.check-changes.outputs.deploy_admin == 'true' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy Admin via docker-compose
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} "
            cd /opt/trackeo &&
            git fetch origin main &&
            git reset --hard origin/main &&
            docker ps -a --filter 'name=trackeo-admin' -q | xargs -r docker rm -f &&
            docker compose up -d --build --no-deps admin
          "

      - name: Health check
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} '
            for i in 1 2 3 4 5; do
              sleep 10
              if curl -sf http://localhost:3001 2>/dev/null; then
                echo "Admin is healthy"
                exit 0
              fi
              echo "Attempt $i failed, retrying..."
            done
            echo "Health check failed after 5 attempts"
            exit 1
          '

      - name: Prune stale Docker data
        if: always()
        continue-on-error: true
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} '
            docker builder prune -af --filter "until=168h"
            docker image prune -f
          '

  # ===========================================
  # BUILD LANDING (on GH runner)
  # ===========================================
  build-landing:
    name: Build Landing
    needs: check-changes
    if: needs.check-changes.outputs.deploy_landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/landing/package-lock.json

      - run: cd apps/landing && npm install
      - run: cd apps/landing && npm run build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_GOOGLE_ANALYTICS_ID: ${{ vars.PUBLIC_GOOGLE_ANALYTICS_ID }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}

      - uses: actions/upload-artifact@v4
        with:
          name: landing-build
          path: apps/landing/dist
          retention-days: 7

  # ===========================================
  # DEPLOY LANDING (static files to VPS)
  # ===========================================
  deploy-landing:
    name: Deploy Landing
    needs: [check-changes, build-landing]
    if: needs.check-changes.outputs.deploy_landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: landing-build
          path: landing

      - uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy static files
        run: |
          scp -o StrictHostKeyChecking=no -r landing/* ${{ secrets.VPS_HOST }}:/opt/trackeo/landing/
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} "chmod -R 755 /opt/trackeo/landing && chown -R www-data:www-data /opt/trackeo/landing"

  # ===========================================
  # DEPLOY INFRA (docker-compose on VPS)
  # ===========================================
  deploy-infra:
    name: Deploy Infrastructure
    needs: [check-changes, deploy-api, deploy-admin]
    if: >-
      always() &&
      needs.check-changes.outputs.deploy_infra == 'true' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped') &&
      (needs.deploy-admin.result == 'success' || needs.deploy-admin.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy infrastructure via docker-compose
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} "
            cd /opt/trackeo &&
            git fetch origin main &&
            trackeo_runtime_changed=\$(git diff --name-only HEAD origin/main -- docker-compose.yml infra/postgres infra/traccar | wc -l) &&
            git reset --hard origin/main &&
            grep -q '^DB_PASS=.' apps/api/.env &&
            touch .env &&
            sed -i '/^DB_PASS=/d' .env &&
            grep '^DB_PASS=' apps/api/.env | perl -pe 's/\\044/\\044\\044/g' >> .env &&
            trackeo_nginx_enabled=\$(grep -Rl 'server_name app.iooeh.com' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | head -n 1) &&
            trackeo_nginx_target=\$(readlink -f \"\$trackeo_nginx_enabled\") &&
            if [ -n \"\$trackeo_nginx_target\" ]; then
              echo \"Updating active vhost source: \$trackeo_nginx_target\" &&
              cp infra/nginx/trackeo.conf \"\$trackeo_nginx_target\";
            else
              echo 'Unable to locate the app.iooeh.com nginx vhost' >&2 && exit 1;
            fi &&
            nginx -t && systemctl reload nginx &&
            if [ \"\$trackeo_runtime_changed\" -gt 0 ]; then
              docker compose pull &&
              docker ps -a --filter 'name=trackeo-traccar' -q | xargs -r docker rm -f &&
              docker compose up -d;
            fi
          "

      - name: Health check
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} '
            for i in 1 2 3 4 5 6; do
              sleep 10
              if curl -sf https://api.iooeh.com/health 2>/dev/null || curl -sf https://api.iooeh.com/ 2>/dev/null; then
                echo "Infrastructure is healthy"
                exit 0
              fi
              echo "Attempt $i failed, retrying..."
            done
            echo "Health check failed after 6 attempts"
            exit 1
          '

      - name: Prune stale Docker data
        if: always()
        continue-on-error: true
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_HOST }} '
            docker builder prune -af --filter "until=168h"
            docker image prune -f
          '

  # ===========================================
  # DEPLOY iOS (TestFlight via Fastlane)
  # ===========================================
  deploy-ios:
    name: Deploy iOS (TestFlight)
    needs: check-changes
    if: needs.check-changes.outputs.deploy_ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: apps/mobile

      - run: cd apps/mobile && bundle install
      - run: cd apps/mobile && flutter pub get
      - run: cd apps/mobile/ios && pod install

      - name: Increment build number
        run: |
          cd apps/mobile
          BUILD_NUMBER=${{ github.run_number }}
          echo "Build number: $BUILD_NUMBER"
          sed -i '' "s/^version: \(.*\)+.*/version: \1+$BUILD_NUMBER/" pubspec.yaml
          cat pubspec.yaml | grep "^version:"

      - name: Write API key to file
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p apps/mobile/private_keys
          printf '%b' "$APP_STORE_CONNECT_API_KEY" > apps/mobile/private_keys/AuthKey.p8

      - name: Build & Upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ github.workspace }}/apps/mobile/private_keys/AuthKey.p8
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
          # Fix: OpenSSL 3 on macOS arm64 rejects 'prime256v1' curve name in p8 keys
          OPENSSL_CONF: /dev/null
        run: cd apps/mobile && bundle exec fastlane ios release

  # ===========================================
  # NOTIFICATION
  # ===========================================
  notify:
    name: Deploy Summary
    needs:
      [
        check-changes,
        deploy-api,
        deploy-web,
        deploy-admin,
        deploy-landing,
        deploy-infra,
        deploy-ios,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Deploy Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| API | ${{ needs.check-changes.outputs.deploy_api }} | ${{ needs.deploy-api.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web | ${{ needs.check-changes.outputs.deploy_web }} | ${{ needs.deploy-web.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Admin | ${{ needs.check-changes.outputs.deploy_admin }} | ${{ needs.deploy-admin.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Landing | ${{ needs.check-changes.outputs.deploy_landing }} | ${{ needs.deploy-landing.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS | ${{ needs.check-changes.outputs.deploy_ios }} | ${{ needs.deploy-ios.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Infra | ${{ needs.check-changes.outputs.deploy_infra }} | ${{ needs.deploy-infra.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any deploy failed
        if: contains(needs.*.result, 'failure')
        run: |
          echo "One or more deploy jobs failed"
          exit 1
