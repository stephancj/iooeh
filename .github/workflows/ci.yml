name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [develop]

jobs:
  # ===========================================
  # DETECT CHANGES (monorepo path filtering)
  # ===========================================
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      mobile: ${{ steps.filter.outputs.mobile }}
      landing: ${{ steps.filter.outputs.landing }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
            mobile:
              - 'apps/mobile/**'
            landing:
              - 'apps/landing/**'
            admin:
              - 'apps/admin/**'

  # ===========================================
  # API: Lint → Test → Build
  # ===========================================
  api-lint:
    name: API Lint
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json
      - run: cd apps/api && npm ci
      - run: cd apps/api && npm run lint

  api-test:
    name: API Test
    needs: [changes, api-lint]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg14
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json
      - run: cd apps/api && npm ci
      - name: Run Tests
        run: cd apps/api && npm run test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test
          DB_PASS: test
          DB_NAME: test

  api-build:
    name: API Build
    needs: [changes, api-test]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json
      - run: cd apps/api && npm ci
      - run: cd apps/api && npm run build

  # ===========================================
  # FLUTTER: Lint → Test → Build
  # ===========================================
  flutter-lint:
    name: Flutter Lint
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          cache: true
      - run: cd apps/mobile && flutter pub get
      - name: Run Analyze
        run: |
          cd apps/mobile
          flutter analyze || {
            OUTPUT=$(flutter analyze 2>&1 || true)
            if echo "$OUTPUT" | grep -q "duplicate_definition"; then
              echo "Only duplicate_definition warnings found - allowing in CI"
              exit 0
            else
              echo "$OUTPUT"
              exit 1
            fi
          }

  flutter-test:
    name: Flutter Test
    needs: [changes, flutter-lint]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          cache: true
      - run: cd apps/mobile && flutter pub get
      - run: cd apps/mobile && flutter test

  flutter-build:
    name: Flutter Build
    needs: [changes, flutter-test]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          cache: true
      - run: cd apps/mobile && flutter pub get
      - name: Build Flutter web
        working-directory: apps/mobile
        env:
          CARTO_BASEMAP_API_KEY: ${{ secrets.CARTO_BASEMAP_API_KEY }}
        run: flutter build web --release --dart-define="CARTO_BASEMAP_API_KEY=$CARTO_BASEMAP_API_KEY"

  # ===========================================
  # ADMIN: Lint → Build
  # ===========================================
  admin-lint:
    name: Admin Lint
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/admin/package-lock.json
      - run: cd apps/admin && npm ci
      - run: cd apps/admin && npm run lint

  admin-build:
    name: Admin Build
    needs: [changes, admin-lint]
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/admin/package-lock.json
      - run: cd apps/admin && npm ci
      - run: cd apps/admin && npm run build

  # ===========================================
  # LANDING: Build
  # ===========================================
  landing-build:
    name: Landing Build
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/landing/package-lock.json
      - run: cd apps/landing && npm ci
      - run: cd apps/landing && npm run build

  # ===========================================
  # STATUS CHECK
  # ===========================================
  ci-status:
    name: CI Status
    needs: [api-build, flutter-build, admin-build, landing-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Pipeline | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| API      | ${{ needs.api-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Flutter  | ${{ needs.flutter-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Admin    | ${{ needs.admin-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Landing  | ${{ needs.landing-build.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure')
        run: |
          echo "One or more CI pipelines failed"
          exit 1
